# Report settings for the HomeBank toolkit — EXAMPLE.
#
# Copy this file to  data\settings.toml  and change it to match your HomeBank file.
# (The data folder is private: it is never uploaded to GitHub.)
# The reports use data\settings.toml automatically; another file can be given with
#   .\hb report run <report> --settings path\to\file.toml
#
# Format: TOML (https://toml.io). Text goes in "double quotes"; lists in [ ... ].
# Names must be spelt as in HomeBank, but capitals do not matter.

[period]
# "calendar" = January to December.
# "tax"      = South African tax year, 1 March to the end of February. A tax year is
#              shown as e.g. 2025/26 and chosen with --year 2026 (SARS calls it the
#              2026 year of assessment).
year_mode = "tax"

[accounts]
# Accounts to leave out of every report, e.g. an account you keep for someone else.
# Transfers to or from these accounts are left out too (not counted as income or expense).
exclude = [
    # "Old cheque account",
    # "Business account",
]

# --- Category groups -----------------------------------------------------------------
# A group collects HomeBank categories and/or tags under one name. A transaction line
# belongs to a group when its category is listed (a top-level category includes all its
# subcategories) or when the transaction has one of the listed tags. A line can be in
# several groups.
#
# Groups whose name starts with "tax:" appear in the tax-year-statement report.
# All groups appear in the category-trends report.
# Category names: as HomeBank shows them, "Parent:Child" for a subcategory.

[groups."tax: rental – property A"]
categories = ["Rental A"]
tags = ["propA"]

[groups."tax: medical"]
categories = ["Medical"]
tags = ["medical"]

[groups."tax: retirement annuity"]
categories = []
# categories = ["Insurance:Retirement annuity"]

[groups.essential]
categories = ["Groceries", "Utilities", "Transport:Fuel", "Medical:Medical aid", "Education"]

[groups.discretionary]
categories = ["Eating out", "Entertainment", "Clothing", "Gifts"]

[inflation]
# Optional. A CSV file with two columns, month and index, e.g. the headline CPI index
# from Stats SA (publication P0141):
#     month,index
#     2024-01,113.0
#     2024-02,114.2
# Months may be written 2024-01, 2024/01 or 202401. A header row is fine, and so are
# ';' separators with decimal commas (as Excel saves them).
# A relative path is looked up next to this settings file.
# When set, category-trends can show amounts in today's prices.
# cpi_file = "cpi.csv"

[reports]
# category-trends highlights categories that grow faster than inflation, but only when
# they average at least this much spending a year (to ignore tiny categories).
min_yearly_spend = 1000
